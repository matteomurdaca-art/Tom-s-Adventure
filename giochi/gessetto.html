<script>/*sala-timer*/(function(){
if(window.__salaTimer) return; window.__salaTimer=1;
var KEY='sala-timer', box=null, pop=null, popT=0, prev=Date.now(), st=null, gateAns=0, gateIn='';
function L(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }

function pauseMs(now){ if(st.pause==='domani'){ var d=new Date(now); d.setHours(24,0,0,0); return d.getTime()-now; } return st.pause*60000; }

var BTN='display:inline-block;margin:6px;padding:12px 18px;border:3px solid #14151d;border-radius:14px;font:800 18px -apple-system,Helvetica,Arial,sans-serif;background:#ffe14a;color:#14151d;box-shadow:0 4px 0 #14151d;cursor:pointer;';

  '<div style="font-size:34px;line-height:1">⏰</div><b style="font-size:20px">Sto per spegnermi tra '+min+(min===1?' minuto!':' minuti!')+'</b><br>'+(min===1?'Salva subito la tua partita: premi <b>◀ Indietro</b>!':'Ricordati di salvare la tua partita: premi <b>◀ Indietro</b> prima che il tempo finisca.'));
  var ok=el('div',BTN+'margin-top:8px;padding:8px 22px','OK'); pop.appendChild(ok); tap(ok,hidePop); document.body.appendChild(pop); popT=setTimeout(hidePop,min===1?12000:9000); }

function showLock(){ if(box) return; hidePop(); autoSave();
  box=el('div','position:fixed;z-index:2147483640;left:0;top:0;right:0;bottom:0;background:#14203f;background:-webkit-linear-gradient(top,#243a6a,#0c1430);background:linear-gradient(180deg,#243a6a,#0c1430);color:#fff;text-align:center;font:700 18px -apple-system,Helvetica,Arial,sans-serif;overflow-y:auto;padding:40px 14px');
  box.innerHTML='<div style="font-size:70px;line-height:1.1">🌙😴</div><div style="font-size:30px;font-weight:900;margin:10px 0">La Sala di Tom si sta riposando</div><div style="font-size:19px;line-height:1.5;max-width:560px;margin:0 auto">Hai giocato '+st.lim+' minuti: bravissimo! Adesso gli occhi si riposano un po\'.<br>Intanto puoi giocare fuori, leggere un libro, disegnare o aiutare mamma e papà.</div><div style="margin:22px auto 6px;font-size:17px;color:#bcd0ff">Si riaccende tra</div><div id="stLeft" style="font-size:46px;font-weight:900;color:#ffe14a">--:--</div>';
  var p=el('div',BTN+'background:#fff;margin-top:28px;font-size:16px','🔒 Genitori'); box.appendChild(p); tap(p,openGate);
  ['touchstart','touchmove','mousedown','keydown'].forEach(function(ev){ box.addEventListener(ev,function(e){ e.stopPropagation(); },false); });
  document.body.appendChild(box); updLock(); }
function hideLock(){ if(box&&box.parentNode) box.parentNode.removeChild(box); box=null; }
function updLock(){ if(!box) return; var e=document.getElementById('stLeft'); if(e) e.textContent=fmt(st.lock-Date.now()); }
var gate=null;

  gate=el('div','position:fixed;z-index:2147483646;left:0;top:0;right:0;bottom:0;background:rgba(5,10,25,.85);text-align:center;padding:30px 10px;overflow-y:auto;font:700 18px -apple-system,Helvetica,Arial,sans-serif;color:#14151d');
  var w=el('div','display:inline-block;background:#fff;border:4px solid #14151d;border-radius:20px;padding:16px;max-width:420px;width:100%');
  w.innerHTML='<b style="font-size:21px">Solo per i grandi</b><br>Quanto fa '+a+' × '+b+'?<div id="stGIn" style="font-size:34px;font-weight:900;margin:8px;min-height:42px;border-bottom:3px solid #14151d"></div>';
  var pad=el('div',''); [1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].forEach(function(k){ var d=el('div',BTN+'width:76px;padding:12px 0;margin:4px;background:'+(k==='OK'?'#7ad36a':'#eef2f8'),String(k)); tap(d,function(){ if(k==='⌫') gateIn=gateIn.slice(0,-1); else if(k==='OK'){ if(+gateIn===gateAns){ closeGate(); openParents(); return; } gateIn=''; document.getElementById('stGIn').textContent='✖'; return; } else if(gateIn.length<3) gateIn+=k; document.getElementById('stGIn').textContent=gateIn; }); pad.appendChild(d); });
  w.appendChild(pad); var c=el('div',BTN+'background:#fff','Annulla'); tap(c,closeGate); w.appendChild(c); gate.appendChild(w);
  ['touchstart','touchmove','mousedown'].forEach(function(ev){ gate.addEventListener(ev,function(e){ e.stopPropagation(); },false); });
  document.body.appendChild(gate); }

  gate=el('div','position:fixed;z-index:2147483646;left:0;top:0;right:0;bottom:0;background:rgba(5,10,25,.85);text-align:center;padding:24px 10px;overflow-y:auto;font:700 17px -apple-system,Helvetica,Arial,sans-serif;color:#14151d');
  var w=el('div','display:inline-block;background:#fff;border:4px solid #14151d;border-radius:20px;padding:16px;max-width:480px;width:100%'); gate.appendChild(w);

    function row(lbl,html){ var r=el('div','margin:12px 0 2px;font-size:16px',lbl+'<br>'); r.appendChild(html); w.appendChild(r); }
    var lr=el('div',''); [10,15,20,30,45,60].forEach(function(m){ var b=el('div',BTN+'padding:8px 12px;font-size:16px;background:'+(st.lim===m?'#7ad36a':'#eef2f8'),m+' min'); tap(b,function(){ st.lim=m; S(); render(); }); lr.appendChild(b); }); row('Minuti di gioco ogni volta',lr);
    var pr=el('div',''); [[15,'15 min'],[30,'30 min'],[60,'1 ora'],[120,'2 ore'],['domani','fino a domani']].forEach(function(o){ var b=el('div',BTN+'padding:8px 12px;font-size:16px;background:'+(st.pause===o[0]?'#7ad36a':'#eef2f8'),o[1]); tap(b,function(){ st.pause=o[0]; S(); render(); }); pr.appendChild(b); }); row('Pausa dopo il tempo di gioco',pr);
    var ar=el('div',''); var b1=el('div',BTN+'font-size:16px','➕ 10 minuti adesso'); tap(b1,function(){ var wl=st.lock&&st.lock>Date.now(); st.used=wl?Math.max(0,st.lim*60000-600000):Math.max(0,st.used-600000); st.lock=0; st.warn={}; S(); hideLock(); render(); }); ar.appendChild(b1);
    var b2=el('div',BTN+'font-size:16px','🔄 Ricomincia da capo'); tap(b2,function(){ st.lock=0; st.used=0; st.warn={}; S(); hideLock(); render(); }); ar.appendChild(b2);
    var b3=el('div',BTN+'font-size:16px;background:'+(st.on?'#ff9a9a':'#7ad36a'),st.on?'✖ Spegni il timer':'▶ Accendi il timer'); tap(b3,function(){ st.on=!st.on; st.lock=0; S(); hideLock(); render(); }); ar.appendChild(b3);

  render(); ['touchstart','touchmove','mousedown'].forEach(function(ev){ gate.addEventListener(ev,function(e){ e.stopPropagation(); },false); });
  document.body.appendChild(gate); }
var chip=null;
function hubChip(){ if(!/\/giochi\/(index\.html)?$/.test(location.pathname)) return; chip=el('div','position:fixed;z-index:2147483000;left:8px;bottom:8px;background:#fff;border:3px solid #14151d;border-radius:14px;padding:6px 10px;font:800 14px -apple-system,Helvetica,Arial,sans-serif;color:#14151d;box-shadow:0 3px 0 #14151d;cursor:pointer','⏱'); tap(chip,openGate); document.body.appendChild(chip); }
function tick(){ var now=Date.now(), dt=Math.min(now-prev,3000); prev=now; load();
  if(!st.on){ hideLock(); if(chip) chip.textContent='⏱ timer spento'; return; }
  if(st.lock){ if(now>=st.lock){ st.lock=0; st.used=0; st.warn={}; S(); hideLock(); } else { showLock(); updLock(); if(chip) chip.textContent='⏱ spenta'; return; } }
  if(st.last&&now-st.last>pauseMs(now)){ st.used=0; st.warn={}; }
  if(!document.hidden){ st.used+=dt; }
  st.last=now; var left=st.lim*60000-st.used;
  [5,2,1].forEach(function(m){ if(left<=m*60000&&left>(m-1)*60000&&!st.warn[m]&&st.lim>m){ st.warn[m]=1; showPop(m); } });
  if(left<=0){ st.lock=now+pauseMs(now); st.used=0; st.warn={}; S(); showLock(); return; }
  if(chip) chip.textContent='⏱ '+Math.ceil(left/60000)+' min';
  S(); }
function init(){ load(); hubChip(); tick(); setInterval(tick,1000); document.addEventListener('visibilitychange',function(){ prev=Date.now(); }); }

})();/*/sala-timer*/</script>
