<script>
(function(){
"use strict";
var $=function(id){ return document.getElementById(id); };

var SND=L('flipper-snd',true), AC=null;

function tone(f,d,type,vol,when){ if(!SND) return; var a=ac(); if(!a) return; try{ var o=a.createOscillator(), g=a.createGain(), t=a.currentTime+(when||0); o.type=type||'square'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(vol||.04,t); g.gain.exponentialRampToValueAtTime(.0005,t+d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.02); }catch(e){} }

function fmt(n){ n=Math.floor(n); var s=String(n), o=''; while(s.length>3){ o='.'+s.slice(-3)+o; s=s.slice(0,-3); } return s+o; }

/* ================= COSTRUZIONE DEI TAVOLI ================= */
var LW=400, LH=720;

function base(t){ var W=t.walls, i, n=28, cx=202.5, cy=205, r=192.5, pts=[];
  W.push(seg(10,720,10,cy));
  for(i=0;i<=n;i++){ var a=Math.PI+Math.PI*i/n; pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]); }
  for(i=0;i<n;i++) W.push(seg(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],.5));
  t.arc=pts;
  W.push(seg(395,cy,395,720));
  W.push(seg(355,720,355,235));
  W.push(seg(355,700,395,700,.05));
  // corsie in alto
  [95,150,205,260].forEach(function(x){ W.push(seg(x,95,x,132,.5)); t.posts.push({x:x,y:95,r:4}); });
  [122,177,232].forEach(function(x,i){ t.sensors.push({x:x,y:116,r:13,kind:'lane',i:i,in:false}); t.lamps.push({id:'lane'+i,x:x,y:150,r:7,col:'#ffe14a'}); });
  // guide in basso
  W.push(seg(10,575,104,630,.3)); W.push(seg(355,575,mir(104),630,.3));
  // fionde

      W.push(seg(q[0],q[1],q[2],q[3],.4)); W.push(seg(q[2],q[3],q[4],q[5],.3)); W.push(seg(q[0],q[1],q[4],q[5],.5,420)); t.slings.push(q); }); });

  return t; }

function bankH(t,x0,y,n,col){ for(var i=0;i<n;i++){ var x=x0+i*34; t.targets.push({x1:x,y1:y,x2:x+26,y2:y,down:false,face:0,col:col,i:i}); t.lamps.push({id:'t'+i,x:x+13,y:y+18,r:6,col:col}); } }

var TABLES=[

   bankV(t,347,250,3,-1,'#f2e9c8'); t.flips.push(flip(22,452,1,48,.5,-.4)); t.flips.push(flip(343,452,-1,48,.5,-.4));

function makeTable(i){ var d=TABLES[i], t={def:d,walls:[],posts:[],bumpers:[],slings:[],flips:[],targets:[],sensors:[],lamps:[],saucers:[]}; base(t); d.build(t);
  t.flips.forEach(function(f,k){ if(k<2) return; var wx=f.side>0?10:355; t.walls.push(seg(wx,f.py-34,f.px,f.py-f.rc-1,.3)); }); t.lampMap={}; t.lamps.forEach(function(l){ t.lampMap[l.id]=l; l.on=false; l.blink=0; }); return t; }

/* ================= DISEGNO DEL TAVOLO (sfondo preparato una volta) ================= */
function rnd(seed){ var s=seed; return function(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }

  var R=rnd(7);

    x.fillStyle='rgba(255,140,60,.25)'; x.beginPath(); x.arc(300,600,46,0,6.3); x.fill(); x.strokeStyle='rgba(255,220,150,.35)'; x.lineWidth=5; x.beginPath(); x.save(); x.translate(300,600); x.scale(1,.3); x.arc(0,0,72,0,6.3); x.restore(); x.stroke();

    x.save(); x.translate(185,410); x.globalAlpha=.35; x.fillStyle='#e8edf2'; x.beginPath(); x.moveTo(0,-60); x.quadraticCurveTo(22,-30,18,30); x.lineTo(-18,30); x.quadraticCurveTo(-22,-30,0,-60); x.fill(); x.fillStyle='#e0373f'; x.beginPath(); x.moveTo(-18,10); x.lineTo(-34,40); x.lineTo(-18,30); x.fill(); x.beginPath(); x.moveTo(18,10); x.lineTo(34,40); x.lineTo(18,30); x.fill(); x.fillStyle='#3fa0e8'; x.beginPath(); x.arc(0,-18,8,0,6.3); x.fill(); x.fillStyle='#ff8a2a'; x.beginPath(); x.moveTo(-10,30); x.lineTo(0,58); x.lineTo(10,30); x.fill(); x.restore(); }
  else if(d.id==='pirati'){ x.fillStyle='rgba(255,255,255,.18)'; for(var w=0;w<9;w++){ var wy=170+w*50; x.beginPath(); for(var xx=10;xx<355;xx+=24){ x.moveTo(xx,wy); x.quadraticCurveTo(xx+6,wy-6,xx+12,wy); x.quadraticCurveTo(xx+18,wy+6,xx+24,wy); } x.lineWidth=2; x.strokeStyle='rgba(255,255,255,.16)'; x.stroke(); }
    x.globalAlpha=.4; x.fillStyle='#e8c87a'; x.beginPath(); x.save(); x.translate(90,470); x.scale(1,.45); x.arc(0,0,60,0,6.3); x.restore(); x.fill(); x.strokeStyle='#7a4a2a'; x.lineWidth=5; x.beginPath(); x.moveTo(90,460); x.quadraticCurveTo(95,420,85,395); x.stroke(); x.fillStyle='#3fae4a'; for(var pl=0;pl<5;pl++){ x.beginPath(); x.save(); x.translate(85,395); x.rotate(pl*1.25); x.scale(1,.35); x.arc(18,0,18,0,6.3); x.restore(); x.fill(); }
    x.fillStyle='#5a3a1a'; x.beginPath(); x.moveTo(220,520); x.lineTo(320,520); x.lineTo(305,545); x.lineTo(235,545); x.closePath(); x.fill(); x.fillStyle='#f6f0e2'; x.beginPath(); x.moveTo(268,515); x.lineTo(268,455); x.lineTo(300,505); x.closePath(); x.fill(); x.beginPath(); x.moveTo(262,515); x.lineTo(262,465); x.lineTo(236,508); x.closePath(); x.fill(); x.globalAlpha=1;
    x.strokeStyle='rgba(160,40,30,.5)'; x.setLineDash&&x.setLineDash([6,6]); x.lineWidth=3; x.beginPath(); x.moveTo(100,330); x.quadraticCurveTo(190,360,280,330); x.stroke(); x.setLineDash&&x.setLineDash([]); x.font='900 26px sans-serif'; x.fillStyle='rgba(200,40,30,.6)'; x.fillText('X',272,340); }
  else { x.globalAlpha=.45; x.fillStyle='#4a3a2a'; x.beginPath(); x.moveTo(110,190); x.lineTo(182,90); x.lineTo(255,190); x.closePath(); x.fill(); x.fillStyle='#ff7a2a'; x.beginPath(); x.moveTo(168,108); x.lineTo(182,90); x.lineTo(196,108); x.lineTo(188,140); x.lineTo(176,128); x.closePath(); x.fill();
    x.fillStyle='#3fae4a'; for(var f=0;f<14;f++){ var fx=10+R()*345, fy=380+R()*260; x.beginPath(); x.save(); x.translate(fx,fy); x.rotate(R()*6); x.scale(1,.3); x.arc(0,0,22,0,6.3); x.restore(); x.fill(); }
    x.fillStyle='#2a6a32'; x.beginPath(); x.save(); x.translate(250,470); x.moveTo(-60,20); x.quadraticCurveTo(-40,-30,0,-30); x.quadraticCurveTo(30,-30,40,-60); x.lineTo(52,-60); x.quadraticCurveTo(50,-20,30,0); x.lineTo(50,30); x.lineTo(-60,30); x.closePath(); x.restore(); x.fill();
    x.fillStyle='#f2e9c8'; [[60,600],[300,610],[150,450]].forEach(function(e){ x.beginPath(); x.save(); x.translate(e[0],e[1]); x.scale(.8,1); x.arc(0,0,12,0,6.3); x.restore(); x.fill(); }); x.globalAlpha=1; }
  // corsia di lancio
  x.fillStyle='rgba(0,0,0,.35)'; x.fillRect(355,235,40,485);

  x.save(); x.translate(182.5,640); x.font='900 18px -apple-system,Helvetica,Arial,sans-serif'; x.textAlign='center'; x.fillStyle='rgba(255,255,255,.3)'; x.fillText(d.name.toUpperCase(),0,60); x.restore();
  // frecce corsie
  x.fillStyle='rgba(255,255,255,.25)'; [122,177,232].forEach(function(lx){ x.beginPath(); x.moveTo(lx-6,170); x.lineTo(lx+6,170); x.lineTo(lx,180); x.closePath(); x.fill(); });
  // muri
  x.lineCap='round'; x.strokeStyle='rgba(0,0,0,.5)'; x.lineWidth=7; t.walls.forEach(function(w){ x.beginPath(); x.moveTo(w.x1+1,w.y1+2); x.lineTo(w.x2+1,w.y2+2); x.stroke(); });
  x.strokeStyle=d.wall; x.lineWidth=5; t.walls.forEach(function(w){ if(w.kick) return; x.beginPath(); x.moveTo(w.x1,w.y1); x.lineTo(w.x2,w.y2); x.stroke(); });

/* luci: sprite di bagliore preparati una volta per colore */
var GLOW={};
function glow(col,r){ var k=col+r; if(GLOW[k]) return GLOW[k]; var c=document.createElement('canvas'), sz=Math.ceil(r*4*SC*DPR)+2; c.width=c.height=sz; var x=c.getContext('2d'), h=sz/2, g=x.createRadialGradient(h,h,0,h,h,h); g.addColorStop(0,col); g.addColorStop(.35,col); g.addColorStop(1,'rgba(0,0,0,0)'); x.globalAlpha=.55; x.fillStyle=g; x.fillRect(0,0,sz,sz); GLOW[k]=c; return c; }

/* ================= STATO DI GIOCO ================= */
var cv=$('cv'), ctx=cv.getContext('2d'), W=0, H=0, DPR=1, SC=1, OXp=0, OYp=0, BG=null;
var TB=null, TI=0, balls=[], G=null, playing=false, paused=false, lastT=0, keys={l:0,r:0}, charge=-1, msgs=[], show=0, attract=0;
function layout(){ W=window.innerWidth; H=window.innerHeight; DPR=Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
  var top=58; SC=Math.min(W/LW,(H-top-6)/LH); OXp=Math.round((W-LW*SC)/2); OYp=Math.round(top+(H-top-LH*SC)/2); BG=null; GLOW={}; }
function buildBG(){ BG=document.createElement('canvas'); BG.width=Math.ceil(LW*SC*DPR); BG.height=Math.ceil(LH*SC*DPR); var x=BG.getContext('2d'); x.setTransform(SC*DPR,0,0,SC*DPR,0,0); drawArt(x,TB); }
