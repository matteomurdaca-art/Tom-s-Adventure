<script>
(function(){
"use strict";
var $=function(id){ return document.getElementById(id); };
function L(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }

var SND=L('flipper-snd',true), AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,d,type,vol,when){ if(!SND) return; var a=ac(); if(!a) return; try{ var o=a.createOscillator(), g=a.createGain(), t=a.currentTime+(when||0); o.type=type||'square'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(vol||.04,t); g.gain.exponentialRampToValueAtTime(.0005,t+d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.02); }catch(e){} }
function jingle(n,step){ for(var i=0;i<n.length;i++) tone(n[i],.14,'square',.035,i*(step||.08)); }

var LW=400, LH=720;
function mir(x){ return 365-x; }
function seg(a,b,c,d,e,k){ return {x1:a,y1:b,x2:c,y2:d,e:e==null?.45:e,kick:k||0}; }
function flip(px,py,side,len,a0,a1){ return {px:px,py:py,side:side,len:len,a0:a0,a1:a1,a:a0,pa:a0,on:false,rc:8}; }
function newT(def){ return {def:def,walls:[],posts:[],bumpers:[],slings:[],flips:[],targets:[],stand:[],sensors:[],lamps:[],saucers:[],spinners:[],arrows:[],nLanes:0,kick:null,outline:null}; }
function roundTop(t){ var W=t.walls, n=30, cx=202.5, cy=205, r=192.5, pts=[[10,720],[10,cy]];
  for(var i=0;i<=n;i++){ var a=Math.PI+Math.PI*i/n; pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]); } pts.push([395,720]);
  for(var k=0;k<pts.length-1;k++) W.push(seg(pts[k][0],pts[k][1],pts[k+1][0],pts[k+1][1],.5)); t.outline=pts; }

function plungerLane(t){ t.walls.push(seg(355,720,355,238)); t.walls.push(seg(355,700,395,700,.05)); }

  if(o.kickL){ W.push(seg(36,540,36,600,.4)); t.posts.push({x:36,y:540,r:5}); W.push(seg(36,600,104,630,.3)); t.kick={x:22,y:668,r:16}; t.lamps.push({id:'kick',x:23,y:612,r:8,col:'#ff5a3a',shape:'arrow',ang:-Math.PI/2}); }
  else W.push(seg(10,575,104,630,.3));
  W.push(seg(355,575,mir(104),630,.3));
  var s=o.sling; [s,[mir(s[0]),s[1],mir(s[2]),s[3],mir(s[4]),s[5]]].forEach(function(q){ W.push(seg(q[0],q[1],q[2],q[3],.4)); W.push(seg(q[2],q[3],q[4],q[5],.3)); W.push(seg(q[0],q[1],q[4],q[5],.5,430)); t.slings.push(q); });

  xs.forEach(function(x,i){ t.sensors.push({x:x,y:(y0+y1)/2,r:13,kind:'lane',i:i}); t.lamps.push({id:'lane'+i,x:x,y:y1+20,r:8,col:col,shape:'arrow',ang:-Math.PI/2}); }); t.nLanes=xs.length; }
function word(t,w,pts,col){ for(var i=0;i<w.length;i++) t.lamps.push({id:'w'+i,x:pts[i][0],y:pts[i][1],r:11,col:col,label:w.charAt(i)}); t.word=w; }
function arcPts(n,cx,cy,rx,ry,a0,a1){ var o=[]; for(var i=0;i<n;i++){ var a=n>1?a0+(a1-a0)*i/(n-1):a0; o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]); } return o; }
function linePts(n,x0,y,dx){ var o=[]; for(var i=0;i<n;i++) o.push([x0+i*dx,y]); return o; }
function mults(t,y){ ['2x','3x','4x','5x'].forEach(function(l,i){ t.lamps.push({id:'m'+(i+2),x:142+i*27,y:y,r:9,col:'#ff5a3a',label:l}); }); }
function bankV(t,x,y0,n,face,col){ for(var i=0;i<n;i++){ var y=y0+i*28; t.targets.push({x1:x,y1:y,x2:x,y2:y+22,down:false,col:col,i:i}); t.lamps.push({id:'t'+i,x:x+face*20,y:y+11,r:6,col:col}); } }
function bankH(t,x0,y,n,col){ for(var i=0;i<n;i++){ var x=x0+i*34; t.targets.push({x1:x,y1:y,x2:x+26,y2:y,down:false,col:col,i:i}); t.lamps.push({id:'t'+i,x:x+13,y:y+18,r:6,col:col}); } }
function standup(t,x,y,ang,col){ var dx=Math.cos(ang)*11, dy=Math.sin(ang)*11, k=t.stand.length; t.stand.push({x1:x-dx,y1:y-dy,x2:x+dx,y2:y+dy,col:col,i:k,lit:false}); t.lamps.push({id:'s'+k,x:x-Math.sin(ang)*16,y:y+Math.cos(ang)*16,r:6,col:col}); }

var TABLES=[
 {id:'spazio',name:'Missione Spazio',sub:'3 leve · pianeti, rotore e buco nero',bg1:'#141a4a',bg2:'#04050f',wall:'#9fb4ff',accent:'#5fd0ff',build:function(t){
   roundTop(t); plungerLane(t); bottom(t,{sling:[40,490,40,560,88,598]});
   lanes(t,[108,163,218,273],92,128,'#ffe14a');
   t.bumpers.push({x:118,y:232,r:22,col:'#ff8a2a',ring:'#ffd0a0',kind:'planet'}); t.bumpers.push({x:205,y:218,r:22,col:'#3fa0e8',ring:'#bfe8ff',kind:'planet'}); t.bumpers.push({x:160,y:300,r:22,col:'#5fd06a',ring:'#c8ffc8',kind:'planet'}); t.bumpers.push({x:262,y:300,r:14,col:'#c8ccd4',ring:'#ffffff',kind:'moon'});
   t.spinners.push({x:318,y:220,w:30,a:0,v:0}); t.lamps.push({id:'spin',x:318,y:248,r:6,col:'#5fd0ff'});
   bankV(t,18,300,4,1,'#ff5adf'); standup(t,128,410,0,'#ffe14a'); standup(t,190,432,0,'#ffe14a');
   t.flips.push(flip(343,372,-1,50,.7,-.25));
   t.saucers.push({x:262,y:430,r:13,ex:-380,ey:-620,label:'BUCO NERO'}); t.lamps.push({id:'sau',x:262,y:458,r:7,col:'#ff5adf',shape:'arrow',ang:-Math.PI/2});
   word(t,'SPAZIO',arcPts(6,182.5,560,80,40,Math.PI*1.18,Math.PI*1.82),'#ffe14a'); mults(t,600);
   t.arrows=[[60,420,-1.9,'#ff5adf'],[300,380,-2.3,'#5fd0ff']]; } },
 {id:'pirati',name:'Isola dei Pirati',sub:'4 leve · barili, cannone e forziere',bg1:'#0f5f7a',bg2:'#d8b46a',wall:'#f2d38a',accent:'#ffcf3a',build:function(t){
   angularTop(t); plungerLane(t); bottom(t,{sling:[46,470,46,556,92,600],kickL:1});
   lanes(t,[238,288],62,100,'#ffcf3a');
   t.posts.push({x:104,y:120,r:6});
   t.saucers.push({x:62,y:175,r:13,ex:300,ey:120,label:'FORZIERE'}); t.lamps.push({id:'sau',x:62,y:205,r:7,col:'#ffcf3a',shape:'arrow',ang:-Math.PI*.6});
   t.bumpers.push({x:205,y:178,r:22,col:'#a0602a',ring:'#f2c230',kind:'barrel'}); t.bumpers.push({x:270,y:220,r:22,col:'#a0602a',ring:'#f2c230',kind:'barrel'}); t.bumpers.push({x:215,y:265,r:22,col:'#a0602a',ring:'#f2c230',kind:'barrel'});
   bankH(t,74,362,5,'#ffcf3a'); standup(t,320,430,Math.PI/2,'#ff5a3a');
   t.flips.push(flip(22,300,1,46,.5,-.4)); t.flips.push(flip(343,330,-1,46,.62,-.3));
   word(t,'TESORO',linePts(6,117.5,520,26),'#ffcf3a'); mults(t,600);
   t.arrows=[[120,320,-1.2,'#ffcf3a'],[90,240,-2.2,'#ffcf3a']]; } },
 {id:'dino',name:'Valle dei Dinosauri',sub:'4 leve · vulcano col nido e multiball',bg1:'#1f5a2a',bg2:'#0c2412',wall:'#c8f08a',accent:'#ff7a2a',build:function(t){
   roundTop(t); plungerLane(t); bottom(t,{sling:[40,500,40,566,86,602]});

   t.walls.push(seg(152,175,166,110,.4)); t.walls.push(seg(213,175,199,110,.4)); t.walls.push(seg(166,110,182.5,97,.4)); t.walls.push(seg(182.5,97,199,110,.4)); t.posts.push({x:152,y:175,r:5}); t.posts.push({x:213,y:175,r:5});
   t.saucers.push({x:182.5,y:140,r:13,ex:0,ey:520,label:'NIDO',lock:1}); t.lamps.push({id:'lock0',x:170,y:196,r:6,col:'#5fd06a'}); t.lamps.push({id:'lock1',x:195,y:196,r:6,col:'#5fd06a'});
   t.bumpers.push({x:92,y:228,r:18,col:'#ff7a2a',ring:'#ffd08a',kind:'egg'}); t.bumpers.push({x:140,y:282,r:18,col:'#ff7a2a',ring:'#ffd08a',kind:'egg'}); t.bumpers.push({x:262,y:250,r:28,col:'#e0373f',ring:'#ffb0a0',kind:'egg'});
   t.spinners.push({x:36,y:300,w:30,a:0,v:0}); t.lamps.push({id:'spin',x:36,y:328,r:6,col:'#ff7a2a'});
   bankV(t,347,300,3,-1,'#f2e9c8'); standup(t,200,390,-.5,'#5fd06a');
   t.flips.push(flip(92,430,1,50,.45,-.45)); t.flips.push(flip(343,462,-1,48,.5,-.4));
   word(t,'DINO',linePts(4,143.5,530,26),'#ff7a2a'); mults(t,600);

];
function makeTable(i){ var d=TABLES[i], t=newT(d); d.build(t);
  t.flips.forEach(function(f,k){ if(k<2||f.px>40&&f.px<330) return; var wx=f.side>0?10:355; t.walls.push(seg(wx,f.py-34,f.px,f.py-f.rc-1,.3)); });
  t.lampMap={}; t.lamps.forEach(function(l){ t.lampMap[l.id]=l; l.on=false; }); return t; }

/* ================= GRAFICA DEL TAVOLO (preparata una volta) ================= */
function rnd(seed){ var s=seed; return function(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function shade(hex,f){ var n=parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255; return 'rgb('+Math.min(255,Math.round(r*f))+','+Math.min(255,Math.round(g*f))+','+Math.min(255,Math.round(b*f))+')'; }
function clipOutline(x,t){ x.beginPath(); t.outline.forEach(function(p,i){ if(i) x.lineTo(p[0],p[1]); else x.moveTo(p[0],p[1]); }); x.closePath(); }
function drawArt(x,t){ var d=t.def; x.save(); clipOutline(x,t); x.clip();
  var g=x.createLinearGradient(0,0,0,LH); g.addColorStop(0,d.bg1); g.addColorStop(1,d.bg2); x.fillStyle=g; x.fillRect(0,0,LW,LH);
  var R=rnd(11);
  if(d.id==='spazio'){ var neb=x.createRadialGradient(240,330,10,240,330,220); neb.addColorStop(0,'rgba(160,80,255,.35)'); neb.addColorStop(1,'rgba(160,80,255,0)'); x.fillStyle=neb; x.fillRect(0,0,LW,LH);
    var neb2=x.createRadialGradient(80,560,10,80,560,170); neb2.addColorStop(0,'rgba(60,180,255,.25)'); neb2.addColorStop(1,'rgba(60,180,255,0)'); x.fillStyle=neb2; x.fillRect(0,0,LW,LH);
    for(var i=0;i<180;i++){ x.fillStyle='rgba(255,255,255,'+(.3+R()*.7)+')'; var sz=R()<.08?2.6:1.3; x.fillRect(R()*LW,R()*LH,sz,sz); }
    x.fillStyle='rgba(255,150,70,.35)'; x.beginPath(); x.arc(300,610,40,0,6.3); x.fill(); x.strokeStyle='rgba(255,220,150,.45)'; x.lineWidth=4; x.beginPath(); x.save(); x.translate(300,610); x.scale(1,.28); x.arc(0,0,64,0,6.3); x.restore(); x.stroke();
