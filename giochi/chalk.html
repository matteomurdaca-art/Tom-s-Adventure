.btn small{font-size:18px;color:var(--dim);margin-top:2px}

#game{padding-top:8px;overflow:hidden}

#main{-webkit-flex:1;flex:1;min-height:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;margin-bottom:0}
