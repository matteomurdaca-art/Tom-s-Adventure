<title>Pittura per Numeri</title>

[hidden]{display:none!important}
.scr{position:absolute;top:0;left:0;right:0;bottom:0}

.sub{max-width:1100px;margin:6px auto 14px;color:#9aa0b5;font-size:16px}

.pill.on{background:#eef0f6;color:#12141d;border-color:#eef0f6;font-weight:700}
.diff{max-width:1100px;margin:0 auto 6px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.diff b{font-size:15px;color:#9aa0b5;font-weight:600;margin-right:2px}
.diff .pill:first-of-type{margin-left:8px}
#gal{max-width:1100px;margin:0 auto;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.card{width:200px;margin:9px;background:#1c1f2c;border:1.5px solid #2c3044;border-radius:18px;padding:10px;text-align:left}
.card canvas{width:178px;height:178px;border-radius:12px;display:block;background:#f2f2f5}
.card .t{font-weight:700;font-size:17px;margin:9px 2px 3px}
.card .p{font-size:14px;color:#9aa0b5;margin:0 2px}
.bar{height:6px;border-radius:3px;background:#2c3044;margin:7px 2px 2px;overflow:hidden}
.bar i{display:block;height:100%;background:-webkit-linear-gradient(0deg,#ff6b9a,#ffb36b);background:linear-gradient(90deg,#ff6b9a,#ffb36b)}
.card.done{border-color:#6be4a0}
/* ---------- gioco ---------- */
#game{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:10px 12px 6px;-webkit-flex:none;flex:none}

#ttl{-webkit-flex:1;flex:1;text-align:center;font-weight:700;font-size:17px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ttl small{display:block;font-weight:500;font-size:13px;color:#9aa0b5}
#top .tb.r{margin:0 0 0 8px}
#mid{-webkit-flex:1;flex:1;position:relative;min-height:0}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
#pal{-webkit-flex:none;flex:none;display:-webkit-flex;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 8px 14px;background:#171a25;border-top:1px solid #262a3b}
.col{-webkit-flex:none;flex:none;width:62px;height:78px;margin:0 4px;border:0;background:transparent;padding:0;position:relative}
.col i{display:block;width:52px;height:52px;margin:0 auto;border-radius:50%;border:2px solid rgba(255,255,255,.15);font-style:normal;font-weight:800;font-size:19px;line-height:48px;text-align:center;-webkit-transition:-webkit-transform .15s;transition:transform .15s}
.col small{display:block;font-size:12px;color:#9aa0b5;margin-top:4px;text-align:center}

.ov p{color:#b8bdcc;margin:0 0 12px;font-size:17px}

</section>
